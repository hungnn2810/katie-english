upstream frontend {
    server frontend:3000;
}

upstream backend {
    server backend:3001;
}

# HTTP → HTTPS redirect; also serves ACME challenge for certbot renewal
server {
    listen 80;
    server_name admin.katie-english.com.vn app.katie-english.com.vn student.katie-english.com.vn api.katie-english.com.vn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------
# Frontend — admin, teacher, student portals (all routed to Next.js)
# Next.js middleware reads the Host header to determine which portal to render
# -----------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name admin.katie-english.com.vn app.katie-english.com.vn student.katie-english.com.vn;

    ssl_certificate     /etc/letsencrypt/live/katie-english.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/katie-english.com.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;

    # Drop scanner bots silently
    if ($bad_bot) { return 444; }

    # Max 20 concurrent connections per IP
    limit_conn conn_per_ip 20;

    # Rate limit page requests (burst allows normal browsing)
    limit_req zone=frontend burst=30 nodelay;
    limit_req_status 429;

    # Block scanner probe paths — 444 = no response (closes TCP without reply)
    location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|phpMyAdmin|adminer|\.env|\.git|\.svn|config\.php|setup\.php|install\.php|shell\.php|cmd\.php|eval-stdin\.php) {
        return 444;
    }

    # Next.js build assets — immutable cache (filenames are content-hashed)
    location /_next/static/ {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# -----------------------------------------------------------------------
# Backend REST API
# -----------------------------------------------------------------------
server {
    listen 443 ssl;
    http2 on;
    server_name api.katie-english.com.vn;

    ssl_certificate     /etc/letsencrypt/live/katie-english.com.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/katie-english.com.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # Drop scanner bots silently
    if ($bad_bot) { return 444; }

    # Only allow methods the API actually uses
    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|OPTIONS)$) {
        return 444;
    }

    # Max 10 concurrent connections per IP
    limit_conn conn_per_ip 10;

    # General API rate limit
    limit_req zone=api_general burst=20 nodelay;
    limit_req_status 429;

    # Block scanner probe paths
    location ~* ^/(wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|phpMyAdmin|adminer|\.env|\.git|\.svn|config\.php|setup\.php|install\.php|shell\.php|cmd\.php|eval-stdin\.php) {
        return 444;
    }

    # Auth endpoints — strict rate limit (10r/m = ~1 attempt per 6s)
    location ~* ^/api/auth/ {
        limit_req zone=api_auth burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 30s;
    }

    location / {
        proxy_pass http://backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (uses map defined in nginx.conf)
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 120s;
    }
}
