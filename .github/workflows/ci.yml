name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — type check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Build (type check)
        working-directory: backend
        run: npm run build

      - name: Run tests
        working-directory: backend
        run: npm test -- --passWithNoTests

  frontend:
    name: Frontend — type check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The frontend build script uses `dotenv -e ../.env` (repo root .env).
      # Create a stub .env with placeholder public values so the build succeeds.
      - name: Create stub .env for build
        run: echo "NEXT_PUBLIC_API_URL=http://localhost:3001" > .env

      - name: Build
        working-directory: frontend
        run: npm run build
