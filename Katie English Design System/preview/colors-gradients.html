<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:12px; }
.g { height:52px; border-radius:12px; display:flex; align-items:flex-end; padding:7px 9px; }
.g span { font-size:10.5px; font-weight:700; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,0.25); }
</style></head>
<body><div class="card-wrap">
  <div class="grid">
    <div class="g" style="background:linear-gradient(135deg,#4F9DFF,#A78BFA)"><span>primaryPurple</span></div>
    <div class="g" style="background:linear-gradient(135deg,#FF9BD2,#FF7B7B)"><span>pinkHighlight</span></div>
    <div class="g" style="background:linear-gradient(135deg,#4F9DFF,#6ED6C1)"><span>primarySecondary</span></div>
    <div class="g" style="background:linear-gradient(135deg,#7BD88F,#6ED6C1)"><span>greenSecondary</span></div>
    <div class="g" style="background:linear-gradient(135deg,#FF9BD2,#FFD166)"><span>pinkAccent</span></div>
    <div class="g" style="background:linear-gradient(135deg,#A78BFA,#FF9BD2)"><span>purplePink</span></div>
  </div>
</div></body></html>
