<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap">
<link rel="stylesheet" href="_card.css">
<style>
.grid { display:grid; grid-template-columns:repeat(8,1fr); gap:16px 10px; width:100%; }
.i { display:flex; flex-direction:column; align-items:center; gap:6px; }
.i svg { width:22px; height:22px; color:#0F172A; stroke-width:2; }
.i span { font:500 9px/1 Inter; color:#94A3B8; }
.note { font:500 11px/1.4 Inter; color:#64748B; }
</style></head>
<body><div class="card-wrap">
  <div class="grid">
    <div class="i"><i data-lucide="layout-dashboard"></i><span>dashboard</span></div>
    <div class="i"><i data-lucide="school"></i><span>classes</span></div>
    <div class="i"><i data-lucide="users"></i><span>students</span></div>
    <div class="i"><i data-lucide="book-open"></i><span>homework</span></div>
    <div class="i"><i data-lucide="mic"></i><span>speaking</span></div>
    <div class="i"><i data-lucide="hash"></i><span>phonics</span></div>
    <div class="i"><i data-lucide="image"></i><span>vocab</span></div>
    <div class="i"><i data-lucide="headphones"></i><span>listen</span></div>
    <div class="i"><i data-lucide="trophy"></i><span>best</span></div>
    <div class="i"><i data-lucide="star"></i><span>score</span></div>
    <div class="i"><i data-lucide="play"></i><span>start</span></div>
    <div class="i"><i data-lucide="party-popper"></i><span>complete</span></div>
    <div class="i"><i data-lucide="graduation-cap"></i><span>teacher</span></div>
    <div class="i"><i data-lucide="key-round"></i><span>password</span></div>
    <div class="i"><i data-lucide="log-out"></i><span>sign out</span></div>
    <div class="i"><i data-lucide="check-circle-2"></i><span>success</span></div>
  </div>
  <div class="note">Lucide React, 2px stroke. Sizes 14–16 inline, 20–24 in cards/headers. No emoji as UI; the only literal glyph is ▶ on phoneme audio buttons.</div>
</div></body></html>
