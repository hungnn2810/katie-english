<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.sw { display:flex; flex-direction:column; gap:6px; }
.chip { width:100%; height:54px; border-radius:10px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
.name { font-size:12px; font-weight:700; }
.hex { font-size:11px; color:#64748B; }
.grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; }
</style></head>
<body><div class="card-wrap">
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#4F9DFF"></div><div class="name">Primary</div><div class="hex mono">#4F9DFF</div></div>
    <div class="sw"><div class="chip" style="background:#6ED6C1"></div><div class="name">Secondary</div><div class="hex mono">#6ED6C1</div></div>
    <div class="sw"><div class="chip" style="background:#FFD166"></div><div class="name">Accent</div><div class="hex mono">#FFD166</div></div>
    <div class="sw"><div class="chip" style="background:#FF7B7B"></div><div class="name">Highlight</div><div class="hex mono">#FF7B7B</div></div>
    <div class="sw"><div class="chip" style="background:#A78BFA"></div><div class="name">Purple</div><div class="hex mono">#A78BFA</div></div>
    <div class="sw"><div class="chip" style="background:#FF9BD2"></div><div class="name">Pink</div><div class="hex mono">#FF9BD2</div></div>
    <div class="sw"><div class="chip" style="background:#FFB26B"></div><div class="name">Orange</div><div class="hex mono">#FFB26B</div></div>
    <div class="sw"><div class="chip" style="background:#7BD88F"></div><div class="name">Green</div><div class="hex mono">#7BD88F</div></div>
  </div>
</div></body></html>
