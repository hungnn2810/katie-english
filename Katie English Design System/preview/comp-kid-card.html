<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;900&display=swap">
<link rel="stylesheet" href="_card.css">
<style>
body { background:#2D0B2E; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; width:100%; }
.card { border-radius:24px; padding:20px; box-shadow:0 12px 28px rgba(0,0,0,0.3); }
.top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; }
.ic { width:46px; height:46px; border-radius:12px; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; }
.ic svg { width:23px; height:23px; color:#fff; }
.chip { display:inline-flex; align-items:center; gap:4px; font:900 12px/1 Inter; color:#fff; padding:5px 9px; border-radius:999px; }
.chip svg { width:12px; height:12px; }
.type { display:flex; align-items:center; gap:6px; color:#fff; font:900 13px/1 Inter; text-transform:uppercase; letter-spacing:0.05em; margin-bottom:10px; }
.type svg { width:15px; height:15px; }
.tag { display:inline-block; background:rgba(255,255,255,0.25); color:#fff; font:700 12px/1 Inter; padding:5px 9px; border-radius:999px; margin:2px 4px 2px 0; }
.go { display:flex; align-items:center; justify-content:center; gap:7px; background:rgba(255,255,255,0.25); color:#fff; font:900 15px/1 Inter; padding:12px; border-radius:12px; margin-top:14px; }
.go svg { width:16px; height:16px; }
</style></head>
<body>
<div class="grid">
  <div class="card" style="background:linear-gradient(135deg,#F97316,#FBBF24)">
    <div class="top"><div class="ic"><i data-lucide="hash"></i></div><span class="chip" style="background:rgba(255,255,255,0.25)"><i data-lucide="calendar"></i>4 days left</span></div>
    <div class="type"><i data-lucide="hash"></i> Phonics</div><div><span class="tag">CVC (6)</span><span class="tag">Digraphs (4)</span></div>
    <div class="go"><i data-lucide="play"></i> Let's Go!</div>
  </div>
  <div class="card" style="background:linear-gradient(135deg,#8B5CF6,#A78BFA)">
    <div class="top"><div class="ic"><i data-lucide="star"></i></div><span class="chip" style="background:#7BD88F"><i data-lucide="trophy"></i>Best: 92%</span></div>
    <div class="type"><i data-lucide="image"></i> Vocabulary</div><div><span class="tag">8 items</span></div>
    <div class="go"><i data-lucide="refresh-cw"></i> Try Again</div>
  </div>
  <div class="card" style="background:linear-gradient(135deg,#06B6D4,#67E8F9)">
    <div class="top"><div class="ic"><i data-lucide="headphones"></i></div><span class="chip" style="background:#FF7B7B"><i data-lucide="zap"></i>1 day left</span></div>
    <div class="type"><i data-lucide="headphones"></i> Listen</div><div><span class="tag">3 questions</span></div>
    <div class="go"><i data-lucide="play"></i> Let's Go!</div>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
