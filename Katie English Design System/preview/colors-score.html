<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.grid { display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; }
.band { border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:4px; color:#2D0B2E; }
.pct { font-size:40px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; }
.rng { font-size:12px; font-weight:700; opacity:0.85; }
.msg { font-size:11px; opacity:0.7; }
</style></head>
<body><div class="card-wrap">
  <div class="grid">
    <div class="band" style="background:#7BD88F"><div class="pct">88%</div><div class="rng">High · ≥ 80</div><div class="msg">Celebrate — “Tuyệt vời!”</div></div>
    <div class="band" style="background:#FFD166"><div class="pct">64%</div><div class="rng">Medium · 50–79</div><div class="msg">Encourage — “Cố lên nhé!”</div></div>
    <div class="band" style="background:#FF7B7B"><div class="pct">38%</div><div class="rng">Low · &lt; 50</div><div class="msg">Motivate — “Thử lại nào!”</div></div>
  </div>
</div></body></html>
