<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.bars { display:flex; flex-direction:column; gap:9px; }
.b { display:flex; align-items:center; gap:12px; }
.bar { height:14px; background:#F0623A; border-radius:3px; }
.n { font-size:11px; font-weight:700; width:64px; }
.v { font-size:10px; color:#94A3B8; }
</style></head>
<body><div class="card-wrap">
  <div class="lbl">8px base unit (MUI spacing)</div>
  <div class="bars">
    <div class="b"><span class="n">1 · 8</span><div class="bar" style="width:8px;"></div><span class="v">tight gaps</span></div>
    <div class="b"><span class="n">2 · 16</span><div class="bar" style="width:16px;"></div><span class="v">stack gap</span></div>
    <div class="b"><span class="n">3 · 24</span><div class="bar" style="width:24px;"></div><span class="v">card padding</span></div>
    <div class="b"><span class="n">4 · 32</span><div class="bar" style="width:32px;"></div><span class="v">page gutter (px:4)</span></div>
    <div class="b"><span class="n">5 · 40</span><div class="bar" style="width:40px;"></div><span class="v">section gap</span></div>
    <div class="b"><span class="n">6 · 48</span><div class="bar" style="width:48px;"></div><span class="v">auth panel pad</span></div>
  </div>
</div></body></html>
