<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.grid { display:flex; gap:26px; align-items:center; padding:6px 4px 14px; }
.r { display:flex; flex-direction:column; gap:10px; align-items:center; }
.box { width:96px; height:60px; background:#fff; border-radius:12px; }
.n { font-size:11px; font-weight:700; }
.s1 { box-shadow:0 1px 3px rgba(15,23,42,0.10),0 1px 2px rgba(15,23,42,0.06); }
.s3 { box-shadow:0 4px 12px rgba(15,23,42,0.10); }
.s4 { box-shadow:0 6px 16px rgba(15,23,42,0.12); }
.s8 { box-shadow:0 12px 28px rgba(15,23,42,0.18); }
</style></head>
<body><div class="card-wrap">
  <div class="grid">
    <div class="r"><div class="box s1"></div><div class="n">1 · subtle</div></div>
    <div class="r"><div class="box s3"></div><div class="n">3 · raised</div></div>
    <div class="r"><div class="box s4"></div><div class="n">4 · hover</div></div>
    <div class="r"><div class="box s8"></div><div class="n">8 · float</div></div>
  </div>
  <div class="lbl">Cards hover-lift (translateY −2px + shadow 4); kid tiles float at shadow 8 and scale 1.05 on hover</div>
</div></body></html>
