<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="_card.css">
<style>
.big { font-family:Inter; font-size:46px; line-height:1; letter-spacing:-0.02em; }
.weights { display:flex; gap:20px; flex-wrap:wrap; }
.w { display:flex; flex-direction:column; gap:2px; }
.w b { font-family:Inter; font-size:24px; }
.w span { font-size:10px; color:#94A3B8; font-weight:700; }
</style></head>
<body><div class="card-wrap">
  <div class="big" style="font-weight:900;">Katie English <span style="color:#F0623A;">Aa</span></div>
  <div class="weights">
    <div class="w"><b style="font-weight:400;">Aa</b><span>400 Regular</span></div>
    <div class="w"><b style="font-weight:500;">Aa</b><span>500 Medium</span></div>
    <div class="w"><b style="font-weight:600;">Aa</b><span>600 Semibold</span></div>
    <div class="w"><b style="font-weight:700;">Aa</b><span>700 Bold</span></div>
    <div class="w"><b style="font-weight:800;">Aa</b><span>800 Extra</span></div>
    <div class="w"><b style="font-weight:900;">Aa</b><span>900 Black</span></div>
  </div>
</div></body></html>
