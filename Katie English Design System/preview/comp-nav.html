<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap">
<link rel="stylesheet" href="_card.css">
<style>
body { background:#0C1220; }
.nav { width:230px; display:flex; flex-direction:column; gap:4px; }
.grp { font:700 11px/1 Inter; text-transform:uppercase; letter-spacing:0.1em; color:#475569; padding:0 14px; margin:6px 0; }
.item { display:flex; align-items:center; gap:11px; padding:11px 14px; border-radius:12px; font:500 14px/1 Inter; color:#94A3B8; position:relative; }
.item svg { width:15px; height:15px; }
.item.active { background:rgba(240,98,58,0.12); color:#FDA087; font-weight:600; }
.item.active::before { content:""; position:absolute; left:0; top:50%; transform:translateY(-50%); width:3px; height:20px; border-radius:0 4px 4px 0; background:#F0623A; }
.item.hover { background:rgba(255,255,255,0.05); color:#E2E8F0; }
</style></head>
<body>
<div class="nav">
  <div class="item active"><i data-lucide="layout-dashboard"></i> Dashboard</div>
  <div class="grp">General</div>
  <div class="item"><i data-lucide="school"></i> Classes</div>
  <div class="item hover"><i data-lucide="users"></i> Students</div>
  <div class="item"><i data-lucide="book-open"></i> Homework</div>
  <div class="item"><i data-lucide="video"></i> Sessions</div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
