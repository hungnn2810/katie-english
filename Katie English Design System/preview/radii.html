<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.grid { display:flex; gap:16px; align-items:flex-end; }
.r { display:flex; flex-direction:column; gap:7px; align-items:center; }
.box { width:80px; height:62px; background:#EEF2F7; box-shadow: inset 0 0 0 1.5px #CBD5E1; }
.n { font-size:11px; font-weight:700; }
.v { font-size:10px; color:#94A3B8; }
.t { font-size:10px; color:#64748B; text-align:center; }
</style></head>
<body><div class="card-wrap">
  <div class="grid">
    <div class="r"><div class="box" style="border-radius:4px;"></div><div class="n">xs · 4</div><div class="t">inputs</div></div>
    <div class="r"><div class="box" style="border-radius:8px;"></div><div class="n">sm · 8</div><div class="t">student base</div></div>
    <div class="r"><div class="box" style="border-radius:12px;"></div><div class="n">md · 12</div><div class="t">nav · chips</div></div>
    <div class="r"><div class="box" style="border-radius:16px;"></div><div class="n">lg · 16</div><div class="t">cards</div></div>
    <div class="r"><div class="box" style="border-radius:24px;"></div><div class="n">xl · 24</div><div class="t">kid tiles</div></div>
    <div class="r"><div class="box" style="border-radius:999px;width:62px;"></div><div class="n">pill</div><div class="t">badges</div></div>
  </div>
</div></body></html>
