<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap">
<link rel="stylesheet" href="_card.css">
<style>
body { background:#F7F9FC; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; width:100%; }
.card { background:#fff; border:1px solid #E2E8F0; border-radius:16px; padding:22px; }
.top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:18px; }
.ic { width:44px; height:44px; border-radius:12px; display:flex; align-items:center; justify-content:center; }
.ic svg { width:20px; height:20px; }
.stat { font:900 30px/1 Inter; letter-spacing:-0.03em; margin-bottom:4px; }
.cap { font:500 14px/1 Inter; color:#64748B; }
.arr { color:#94A3B8; }
</style></head>
<body>
<div class="grid">
  <div class="card"><div class="top"><div class="ic" style="background:#FFF2EF"><i data-lucide="school" style="color:#F0623A"></i></div><i data-lucide="arrow-right" class="arr"></i></div><div class="stat" style="color:#F0623A">12</div><div class="cap">Total Classes</div></div>
  <div class="card"><div class="top"><div class="ic" style="background:#F0FDFB"><i data-lucide="users" style="color:#6ED6C1"></i></div><i data-lucide="arrow-right" class="arr"></i></div><div class="stat" style="color:#6ED6C1">148</div><div class="cap">Total Students</div></div>
  <div class="card"><div class="top"><div class="ic" style="background:#F5F3FF"><i data-lucide="book-open" style="color:#A78BFA"></i></div><i data-lucide="arrow-right" class="arr"></i></div><div class="stat" style="color:#A78BFA">36</div><div class="cap">Homework Sets</div></div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
