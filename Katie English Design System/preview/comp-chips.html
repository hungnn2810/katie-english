<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;900&display=swap">
<link rel="stylesheet" href="_card.css">
<style>
.row3 { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:6px; }
.chip { display:inline-flex; align-items:center; gap:5px; font-family:Inter; font-weight:900; font-size:13px; padding:5px 11px; border-radius:999px; color:#fff; }
.chip svg { width:13px; height:13px; }
.pro { font-weight:700; font-size:12px; padding:4px 10px; }
.lbl2 { font-size:10px; color:#94A3B8; font-weight:700; width:44px; }
.wine { background:#2D0B2E; border-radius:10px; padding:11px; }
</style></head>
<body><div class="card-wrap">
  <div class="wine">
    <div class="row3">
      <span class="lbl2" style="color:rgba(255,255,255,0.5)">Kid</span>
      <span class="chip" style="background:#7BD88F"><i data-lucide="trophy"></i> Best: 92%</span>
      <span class="chip" style="background:#FF7B7B"><i data-lucide="zap"></i> 1 day left</span>
      <span class="chip" style="background:rgba(255,255,255,0.25)"><i data-lucide="calendar"></i> 4 days left</span>
      <span class="chip" style="background:#FF7B7B"><i data-lucide="alert-triangle"></i> Overdue</span>
    </div>
  </div>
  <div class="row3">
    <span class="lbl2">Pro</span>
    <span class="chip pro" style="background:#F0FDF4;color:#16A34A">Approved</span>
    <span class="chip pro" style="background:#FFFBEB;color:#92400E">Pending</span>
    <span class="chip pro" style="background:#FFF2EF;color:#F0623A">in 2h</span>
    <span class="chip pro" style="background:#F1F5F9;color:#64748B">Ended</span>
  </div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
