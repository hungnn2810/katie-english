<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.sw { display:flex; flex-direction:column; gap:6px; }
.chip { width:100%; height:64px; border-radius:10px; display:flex; align-items:flex-end; padding:8px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
.chip .k { width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-size:13px; }
.name { font-size:12px; font-weight:700; }
.hex { font-size:11px; color:#64748B; }
.use { font-size:10px; color:#94A3B8; }
.grid { display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; }
</style></head>
<body><div class="card-wrap">
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#F0623A"><div class="k" style="background:rgba(255,255,255,0.25)">K</div></div><div class="name">Teacher</div><div class="hex mono">#F0623A</div><div class="use">teacherAccent</div></div>
    <div class="sw"><div class="chip" style="background:#4F9DFF"><div class="k" style="background:rgba(255,255,255,0.25)">K</div></div><div class="name">Admin</div><div class="hex mono">#4F9DFF</div><div class="use">primary</div></div>
    <div class="sw"><div class="chip" style="background:#A78BFA"><div class="k" style="background:rgba(255,255,255,0.25)">K</div></div><div class="name">Student</div><div class="hex mono">#A78BFA</div><div class="use">studentTheme</div></div>
    <div class="sw"><div class="chip" style="background:#0C1220"><div class="k" style="background:#F0623A">K</div></div><div class="name">Sidebar</div><div class="hex mono">#0C1220</div><div class="use">dark navy</div></div>
  </div>
</div></body></html>
