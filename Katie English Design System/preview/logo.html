<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap">
<link rel="stylesheet" href="_card.css">
<style>
.row3 { display:flex; gap:30px; align-items:center; flex-wrap:wrap; }
.lock { display:flex; align-items:center; gap:11px; }
.k { display:flex; align-items:center; justify-content:center; color:#fff; font-weight:900; font-family:Inter; box-shadow:0 4px 12px rgba(15,23,42,0.18); }
.wm { font-family:Inter; font-weight:700; letter-spacing:-0.02em; }
.sub { font-size:10px; color:#94A3B8; font-weight:700; }
.onbox { background:#0C1220; border-radius:12px; padding:14px 16px; }
.onwine { background:#2D0B2E; border-radius:12px; padding:14px 16px; }
</style></head>
<body><div class="card-wrap">
  <div class="row3">
    <div class="lock"><div class="k" style="width:40px;height:40px;border-radius:8px;background:#F0623A;font-size:16px;">K</div><div><div class="wm" style="font-size:18px;color:#0F172A;">Katie English</div></div></div>
    <div class="onbox lock"><div class="k" style="width:36px;height:36px;border-radius:12px;background:#F0623A;font-size:14px;">K</div><div><div class="wm" style="font-size:14px;color:#fff;">Katie English</div><div class="sub" style="color:#64748B;">Teacher Portal</div></div></div>
    <div class="onwine lock"><div class="k" style="width:48px;height:48px;border-radius:14px;background:#fff;color:#4F9DFF;font-size:20px;">K</div><div class="wm" style="font-size:20px;color:#fff;">Katie English</div></div>
  </div>
  <div class="lbl">Monogram “K” in a rounded square — accent-filled on light, white-filled on the kid wine background. No image asset; pure type + chip.</div>
</div></body></html>
