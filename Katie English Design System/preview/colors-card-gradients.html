<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<style>
.grid { display:grid; grid-template-columns: repeat(6, 1fr); gap:12px; }
.g { aspect-ratio:1/1.05; border-radius:16px; box-shadow:0 8px 18px rgba(15,23,42,0.18); display:flex; align-items:flex-end; padding:9px; }
.g span { font-size:11px; font-weight:900; color:#fff; }
.cap { font-size:11px; color:#64748B; }
</style></head>
<body><div class="card-wrap">
  <div class="grid">
    <div class="g" style="background:linear-gradient(135deg,#F97316,#FBBF24)"><span>1</span></div>
    <div class="g" style="background:linear-gradient(135deg,#EC4899,#F472B6)"><span>2</span></div>
    <div class="g" style="background:linear-gradient(135deg,#8B5CF6,#A78BFA)"><span>3</span></div>
    <div class="g" style="background:linear-gradient(135deg,#10B981,#34D399)"><span>4</span></div>
    <div class="g" style="background:linear-gradient(135deg,#EF4444,#F87171)"><span>5</span></div>
    <div class="g" style="background:linear-gradient(135deg,#06B6D4,#67E8F9)"><span>6</span></div>
  </div>
  <div class="cap">Student homework cards cycle through these 6 in order — every assignment gets a distinct, energetic tile.</div>
</div></body></html>
