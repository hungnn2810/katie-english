<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap">
<link rel="stylesheet" href="_card.css">
<style>
body { background:#2D0B2E; }
.grid { display:flex; gap:30px; width:100%; justify-content:space-around; align-items:flex-start; }
.st { display:flex; flex-direction:column; align-items:center; gap:12px; }
.btn { width:76px; height:76px; border-radius:50%; display:flex; align-items:center; justify-content:center; position:relative; }
.btn svg { width:32px; height:32px; color:#fff; }
.idle { border:4px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.1); }
.rec { border:4px solid #ef4444; background:rgba(239,68,68,0.2); }
.rec .sq { width:26px; height:26px; border-radius:5px; background:#f87171; }
.ping { position:absolute; inset:-4px; border-radius:50%; background:#ef4444; opacity:0.25; animation:ping 1.3s cubic-bezier(0,0,0.2,1) infinite; }
@keyframes ping { 75%,100% { transform:scale(1.8); opacity:0; } }
.scor { border:4px solid rgba(255,255,255,0.3); background:rgba(255,255,255,0.1); }
.spin { width:30px; height:30px; border:3px solid rgba(255,255,255,0.25); border-top-color:#fff; border-radius:50%; animation:s 0.8s linear infinite; }
@keyframes s { to { transform:rotate(360deg); } }
.done { border:4px solid rgba(52,211,153,0.5); background:rgba(52,211,153,0.15); }
.done svg { color:#34d399; }
.cap { font:600 13px/1.3 Inter; color:rgba(255,255,255,0.65); text-align:center; }
</style></head>
<body>
<div class="grid">
  <div class="st"><div class="btn idle"><i data-lucide="mic"></i></div><div class="cap">Tap to record</div></div>
  <div class="st"><div class="btn rec"><div class="ping"></div><div class="sq"></div></div><div class="cap" style="color:#f87171">Recording… tap to stop</div></div>
  <div class="st"><div class="btn scor"><div class="spin"></div></div><div class="cap">Scoring…</div></div>
  <div class="st"><div class="btn done"><i data-lucide="check"></i></div><div class="cap" style="color:#34d399">Done</div></div>
</div>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script>lucide.createIcons();</script>
</body></html>
